# ==============================================================================
# MoneyHoney Production Nginx Configuration
# Reverse Proxy Cache (Port 80) -> API Gateway (Port 8000) -> Load Balancer (Port 8001)
# ==============================================================================

# Fast in-memory / disk cache zone for market data GET requests
proxy_cache_path /var/cache/nginx/moneyhoney 
    levels=1:2 
    keys_zone=mh_market_cache:20m 
    max_size=1g 
    inactive=60m 
    use_temp_path=off;

# Edge Leaky-Bucket Rate Limiting (30 requests/second per IP with burst allowance of 20)
limit_req_zone $binary_remote_addr zone=edge_rate_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# Upstream Definitions
# ------------------------------------------------------------------------------

# API Gateway Upstream (Port 8000)
upstream api_gateway_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# FastAPI Worker Cluster (Ports 8081, 8082, 8083) - Round Robin / Least Connections
upstream fastapi_cluster {
    least_conn;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8083 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. Edge Reverse Proxy & Cache (Port 80 / 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # Edge Rate Limiting applied to all incoming API traffic
    limit_req zone=edge_rate_limit burst=20 nodelay;
    limit_req_status 429;

    # Logging
    access_log /var/log/nginx/moneyhoney_access.log combined;
    error_log  /var/log/nginx/moneyhoney_error.log warn;

    # Proxy Buffer Tuning for High-Throughput Market Data
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;

    # Forward to API Gateway (Port 8000)
    location / {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Edge Proxy Headers
        add_header X-Served-By "MoneyHoney-Nginx-Edge" always;
    }

    # High-Performance Caching for Read-Only Market Ticker Data
    location /mh/v1/get_data/ {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Cache Settings
        proxy_cache mh_market_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        add_header X-Nginx-Cache-Status $upstream_cache_status always;
        add_header X-Served-By "MoneyHoney-Nginx-Edge-Cache" always;
    }
}

# ------------------------------------------------------------------------------
# 2. Internal Load Balancer (Port 8001)
# Routes requests from API Gateway to FastAPI Instances (8081, 8082, 8083)
# ------------------------------------------------------------------------------
server {
    listen 8001;
    server_name localhost;

    access_log /var/log/nginx/moneyhoney_lb_access.log;
    error_log  /var/log/nginx/moneyhoney_lb_error.log;

    location / {
        proxy_pass http://fastapi_cluster;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Retry next upstream worker if current worker errors or times out
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        add_header X-LB-Upstream-Addr $upstream_addr always;
        add_header X-LB-Response-Time $upstream_response_time always;
    }
}
